<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Home</title>
</head>
<body>
    <div class="Heading">
        <h1> Welcome to Blog Website</h1>
    </div>
    <div class="Options">
        <p> LOGIN </p>
    </div>

    <div class = "Login">
        
        
        <form action="/redirect_home", method="POST">
            <input type="text" name="username" placeholder="Username" required style="margin-bottom: 10px;">
            <br>
            <input type="password" name="password" placeholder="Password" required style="margin-bottom: 10px;">
            <br>
            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}
            




            <input type="submit" name = "action" value="Login" style="width: 170px; height: 35px; font-size: 20px;">
        </form>
        <br>
        
        <form action="/register", method="GET">
            <input type="submit" name = "action" value="Sign-up" style="width: 170px; height: 35px; font-size: 20px;">
        </form>
            
        
    </div>
</body>
</html>
